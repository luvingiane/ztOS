# AirPlay (RAOP) outputs: PipeWire finds the AirPlay receivers on the network through
# avahi (mDNS) and makes a sink for each one, so ztMETRO can list them next to the
# speaker and play on several at once. Needs pipewire-zeroconf and avahi-daemon.
# ifexists nofail: a system without the package starts PipeWire all the same.
context.modules = [
  { name = libpipewire-module-raop-discover
    flags = [ ifexists nofail ]
  }
]
